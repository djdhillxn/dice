[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dice"
version = "0.2.0"
description = "DICE: command-conditioned in-hand die reorientation with Isaac Lab and RSL-RL PPO."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dheeraj Dhillon"}]
dependencies = [
  "gymnasium",
  "numpy",
  "pandas",
  "tqdm",
]

[project.optional-dependencies]
video = ["opencv-python"]

[tool.setuptools]
package-dir = {"" = "source"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["source"]

[tool.setuptools.package-data]
dicedial = ["agents/*.py", "assets/*.usda"]
